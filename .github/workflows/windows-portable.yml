name: Windows Portable Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  windows-portable:
    runs-on: [self-hosted, Windows, X64, clipforge-windows-build]
    timeout-minutes: 30
    defaults:
      run:
        shell: powershell
    env:
      CARGO_HOME: C:\Rust\cargo
      RUSTUP_HOME: C:\Rust\rustup
      CARGO_TARGET_DIR: C:\Rust\target\portable-release
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - name: Configure persistent Rust toolchain & check disk space
        run: |
          $ErrorActionPreference = "Stop"
          "C:\Rust\cargo\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $env:PATH = "C:\Rust\cargo\bin;$env:PATH"

          rustc --version
          if ($LASTEXITCODE -ne 0) { throw "rustc --version failed with exit code $LASTEXITCODE" }
          cargo --version
          if ($LASTEXITCODE -ne 0) { throw "cargo --version failed with exit code $LASTEXITCODE" }

          $targetDir = $env:CARGO_TARGET_DIR
          if ($targetDir -and -not (Test-Path -LiteralPath $targetDir -PathType Container)) {
            New-Item -ItemType Directory -Path $targetDir -Force | Out-Null
          }

          $drive = Get-PSDrive -Name C
          $freeGb = [math]::Round($drive.Free / 1GB, 2)
          Write-Host "Free disk space on C:: $freeGb GB"
          if ($freeGb -lt 15) {
            Write-Warning "Low disk space on C: ($freeGb GB < 15 GB)."
          }
      - name: Verify persistent FFmpeg
        run: |
          $ErrorActionPreference = "Stop"
          $ffmpegDir = "C:\ffmpeg-bin"
          $ffmpegExe = Join-Path $ffmpegDir "ffmpeg.exe"
          $ffprobeExe = Join-Path $ffmpegDir "ffprobe.exe"

          if (-not ((Test-Path -LiteralPath $ffmpegExe -PathType Leaf) -and (Test-Path -LiteralPath $ffprobeExe -PathType Leaf))) {
            throw "Missing C:\ffmpeg-bin\ffmpeg.exe or ffprobe.exe on clipforge-win-builder."
          }

          "C:\ffmpeg-bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $env:PATH = "C:\ffmpeg-bin;$env:PATH"
          ffmpeg -version
          if ($LASTEXITCODE -ne 0) { throw "ffmpeg -version failed with exit code $LASTEXITCODE" }
          ffprobe -version
          if ($LASTEXITCODE -ne 0) { throw "ffprobe -version failed with exit code $LASTEXITCODE" }
      - name: Build release binary
        run: |
          $ErrorActionPreference = "Stop"
          cargo build --release -p clipforge-desktop
          if ($LASTEXITCODE -ne 0) { throw "cargo build failed with exit code $LASTEXITCODE" }
      - name: Package Windows portable bundle
        run: ./packaging/windows/package-portable.ps1 -TargetDir "C:\Rust\target\portable-release\release" -OutDir "${{ runner.temp }}/dist" -FfmpegDir "C:\ffmpeg-bin"
      - name: Upload & verify Windows portable artifact in RustFS
        env:
          RUSTFS_ACCESS_KEY_ID: ${{ secrets.RUSTFS_ACCESS_KEY_ID }}
          RUSTFS_SECRET_ACCESS_KEY: ${{ secrets.RUSTFS_SECRET_ACCESS_KEY }}
          RUSTFS_ENDPOINT: https://s3.emkacz.dev
          RUSTFS_BUCKET: clipforge-builds
        run: |
          $ErrorActionPreference = "Stop"
          if (-not $env:RUSTFS_ACCESS_KEY_ID -or -not $env:RUSTFS_SECRET_ACCESS_KEY) {
            throw "RUSTFS_ACCESS_KEY_ID and RUSTFS_SECRET_ACCESS_KEY secrets must be configured."
          }
          $mode = if ("${{ github.ref }}".StartsWith("refs/tags/")) { "releases" } else { "ci" }
          ./scripts/ci/upload_rustfs.ps1 `
            -Mode $mode `
            -Platform "windows-x64" `
            -Version "${{ github.ref_name }}" `
            -Commit "${{ github.sha }}" `
            -RunId "${{ github.run_id }}" `
            -Workflow "${{ github.workflow }}" `
            -VerifyDownload `
            -Artifacts @(
              "${{ runner.temp }}/dist/ClipForge-Windows-x64-portable.zip",
              "${{ runner.temp }}/dist/ClipForge-Windows-x64-portable.zip.sha256"
            )
