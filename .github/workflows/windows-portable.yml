name: Windows Portable Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always

jobs:
  windows-build:
    runs-on: [self-hosted, Windows, X64, clipforge-windows-build]
    defaults:
      run:
        shell: powershell
    env:
      CARGO_HOME: C:\Rust\cargo
      RUSTUP_HOME: C:\Rust\rustup
      CARGO_TARGET_DIR: C:\Rust\target\portable-release
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - name: Configure persistent Rust toolchain & check disk space
        run: |
          $ErrorActionPreference = "Stop"
          "C:\Rust\cargo\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $env:PATH = "C:\Rust\cargo\bin;$env:PATH"

          rustc --version
          if ($LASTEXITCODE -ne 0) { throw "rustc --version failed with exit code $LASTEXITCODE" }
          cargo --version
          if ($LASTEXITCODE -ne 0) { throw "cargo --version failed with exit code $LASTEXITCODE" }

          $targetDir = $env:CARGO_TARGET_DIR
          if ($targetDir -and -not (Test-Path -LiteralPath $targetDir -PathType Container)) {
            New-Item -ItemType Directory -Path $targetDir -Force | Out-Null
          }

          $drive = Get-PSDrive -Name C
          $freeGb = [math]::Round($drive.Free / 1GB, 2)
          Write-Host "Free disk space on C:: $freeGb GB"
          if ($freeGb -lt 15) {
            Write-Warning "Low disk space on C: ($freeGb GB < 15 GB). Pruning persistent target dir: $targetDir"
            if ($targetDir -and (Test-Path -LiteralPath $targetDir)) {
              Remove-Item -LiteralPath $targetDir -Recurse -Force -ErrorAction SilentlyContinue
              New-Item -ItemType Directory -Path $targetDir -Force | Out-Null
            }
            $driveAfter = Get-PSDrive -Name C
            $freeGbAfter = [math]::Round($driveAfter.Free / 1GB, 2)
            Write-Host "Free disk space on C: after prune: $freeGbAfter GB"
          }
      - name: Build release binary
        run: cargo build --release -p clipforge-desktop
      - name: Upload release binary
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-bin
          path: |
            C:/Rust/target/portable-release/release/clipforge-desktop.exe
            C:/Rust/target/portable-release/release/*.dll
          retention-days: 1
          if-no-files-found: warn

  package-portable:
    needs: windows-build
    runs-on: [self-hosted, Windows, X64, clipforge-windows-build]
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - name: Ensure FFmpeg on persistent runner & verify
        run: |
          $ErrorActionPreference = "Stop"
          $ffmpegDir = "C:\ffmpeg-bin"
          $ffmpegExe = Join-Path $ffmpegDir "ffmpeg.exe"
          $ffprobeExe = Join-Path $ffmpegDir "ffprobe.exe"

          if (-not ((Test-Path -LiteralPath $ffmpegExe -PathType Leaf) -and (Test-Path -LiteralPath $ffprobeExe -PathType Leaf))) {
            New-Item -ItemType Directory -Path $ffmpegDir -Force | Out-Null
            $chocoCmd = Get-Command choco -ErrorAction SilentlyContinue
            if ($chocoCmd) {
              Write-Host "Installing FFmpeg via Chocolatey..."
              choco install ffmpeg -y --no-progress
              if ($LASTEXITCODE -ne 0) { throw "choco install ffmpeg failed with exit code $LASTEXITCODE" }
              $chocoRoot = if ($env:ChocolateyInstall) { $env:ChocolateyInstall } else { "C:\ProgramData\chocolatey" }
              $toolsDir = Join-Path $chocoRoot "lib\ffmpeg\tools"
              $foundFfmpeg = Get-ChildItem -Path $toolsDir -Filter "ffmpeg.exe" -Recurse -File | Select-Object -First 1
              if (-not $foundFfmpeg) { throw "ffmpeg.exe not found under $toolsDir" }
              $srcBinDir = $foundFfmpeg.DirectoryName
              $srcPkgDir = Split-Path -Path $srcBinDir -Parent
              Copy-Item -Path (Join-Path $srcBinDir "*") -Destination $ffmpegDir -Recurse -Force
              foreach ($doc in @("LICENSE", "LICENSE.txt", "README", "README.txt")) {
                $docPath = Join-Path $srcPkgDir $doc
                if (Test-Path -LiteralPath $docPath -PathType Leaf) {
                  Copy-Item -LiteralPath $docPath -Destination $ffmpegDir -Force
                }
              }
            } else {
              Write-Host "Chocolatey not found; downloading FFmpeg from gyan.dev..."
              [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
              $zipUrl = "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
              $tempRoot = Join-Path $env:RUNNER_TEMP ("ffmpeg-dl-" + [guid]::NewGuid().ToString("N"))
              $zipPath = Join-Path $tempRoot "ffmpeg-release-essentials.zip"
              $extractDir = Join-Path $tempRoot "extract"
              New-Item -ItemType Directory -Path $tempRoot -Force | Out-Null
              try {
                Invoke-WebRequest -Uri $zipUrl -OutFile $zipPath -UseBasicParsing
                Expand-Archive -LiteralPath $zipPath -DestinationPath $extractDir -Force
                $foundFfmpeg = Get-ChildItem -Path $extractDir -Filter "ffmpeg.exe" -Recurse -File | Select-Object -First 1
                if (-not $foundFfmpeg) { throw "ffmpeg.exe not found in downloaded archive" }
                $srcBinDir = $foundFfmpeg.DirectoryName
                $srcPkgDir = Split-Path -Path $srcBinDir -Parent
                Copy-Item -Path (Join-Path $srcBinDir "*") -Destination $ffmpegDir -Recurse -Force
                foreach ($doc in @("LICENSE", "LICENSE.txt", "README", "README.txt")) {
                  $docPath = Join-Path $srcPkgDir $doc
                  if (Test-Path -LiteralPath $docPath -PathType Leaf) {
                    Copy-Item -LiteralPath $docPath -Destination $ffmpegDir -Force
                  }
                }
              } finally {
                if (Test-Path -LiteralPath $tempRoot) {
                  Remove-Item -LiteralPath $tempRoot -Recurse -Force -ErrorAction SilentlyContinue
                }
              }
            }
          } else {
            Write-Host "Using persistent FFmpeg at $ffmpegDir"
          }

          "C:\ffmpeg-bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $env:PATH = "C:\ffmpeg-bin;$env:PATH"
          & $ffmpegExe -version
          if ($LASTEXITCODE -ne 0) { throw "ffmpeg -version failed with exit code $LASTEXITCODE" }
          & $ffprobeExe -version
          if ($LASTEXITCODE -ne 0) { throw "ffprobe -version failed with exit code $LASTEXITCODE" }
      - name: Download release binary
        uses: actions/download-artifact@v4
        with:
          name: windows-release-bin
          path: target/release
      - name: Package Windows portable bundle
        run: ./packaging/windows/package-portable.ps1 -TargetDir "target/release" -OutDir "${{ runner.temp }}/dist" -FfmpegDir "C:\ffmpeg-bin"
      - name: Upload Windows portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClipForge-Windows-x64-portable
          path: |
            ${{ runner.temp }}/dist/ClipForge-Windows-x64-portable.zip
            ${{ runner.temp }}/dist/ClipForge-Windows-x64-portable.zip.sha256
          if-no-files-found: error
