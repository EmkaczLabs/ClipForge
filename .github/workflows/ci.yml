name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'design/**'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'design/**'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libasound2-dev \
            libxkbcommon-dev \
            ffmpeg
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: linux-ci
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Cargo clippy workspace
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Run tests
        run: cargo test --workspace

  windows-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache FFmpeg
        id: cache-ffmpeg
        uses: actions/cache@v4
        with:
          path: C:\ffmpeg-bin
          key: win-ffmpeg-v1
      - name: Install FFmpeg (on cache miss)
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          choco install ffmpeg -y --no-progress
          $chocoRoot = if ($env:ChocolateyInstall) { $env:ChocolateyInstall } else { "C:\ProgramData\chocolatey" }
          $toolsDir = Join-Path $chocoRoot "lib\ffmpeg\tools"
          $ffmpegExe = Get-ChildItem -Path $toolsDir -Filter "ffmpeg.exe" -Recurse -File | Select-Object -First 1
          if (-not $ffmpegExe) { throw "ffmpeg.exe not found under $toolsDir" }
          $srcBinDir = $ffmpegExe.DirectoryName
          $srcPkgDir = Split-Path -Path $srcBinDir -Parent
          New-Item -ItemType Directory -Path "C:\ffmpeg-bin" -Force | Out-Null
          Copy-Item -Path (Join-Path $srcBinDir "*") -Destination "C:\ffmpeg-bin" -Recurse -Force
          foreach ($doc in @("LICENSE", "LICENSE.txt", "README", "README.txt")) {
            $docPath = Join-Path $srcPkgDir $doc
            if (Test-Path -LiteralPath $docPath -PathType Leaf) {
              Copy-Item -LiteralPath $docPath -Destination "C:\ffmpeg-bin" -Force
            }
          }
      - name: Add FFmpeg to PATH and verify
        shell: pwsh
        run: |
          "C:\ffmpeg-bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $env:PATH = "C:\ffmpeg-bin;$env:PATH"
          ffmpeg -version
          ffprobe -version
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: win-test
      - name: Run workspace tests
        run: cargo test --workspace --exclude clipforge-server
