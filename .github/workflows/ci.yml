name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libasound2-dev \
            libxkbcommon-dev \
            ffmpeg
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Cargo clippy workspace
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Cargo check workspace
        run: cargo check --workspace
      - name: Run tests
        run: cargo test --workspace

  windows-portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg and FFprobe
        shell: pwsh
        run: |
          choco install ffmpeg -y --no-progress
          $chocoBin = Join-Path $env:ChocolateyInstall "bin"
          if (Test-Path -LiteralPath $chocoBin) {
            $chocoBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
      - name: Verify FFmpeg and FFprobe on PATH
        shell: pwsh
        run: |
          ffmpeg -version
          ffprobe -version
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Cargo check workspace
        run: cargo check --workspace
      - name: Run workspace tests
        run: cargo test --workspace
      - name: Build release binary
        run: cargo build --release -p clipforge-desktop
      - name: Package Windows portable bundle
        shell: pwsh
        run: ./packaging/windows/package-portable.ps1 -OutDir "${{ runner.temp }}/dist"
      - name: Upload Windows portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClipForge-Windows-x64-portable
          path: |
            ${{ runner.temp }}/dist/ClipForge-Windows-x64-portable.zip
            ${{ runner.temp }}/dist/ClipForge-Windows-x64-portable.zip.sha256
          if-no-files-found: error
