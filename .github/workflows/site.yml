name: Site CI

on:
  push:
    branches: [main]
    paths:
      - 'apps/site/**'
      - '.github/workflows/site.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/site/**'
      - '.github/workflows/site.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/site
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: |
          npx playwright install --with-deps chromium
          CHROMIUM_PATH=$(node -e "const { chromium } = require('@playwright/test'); console.log(chromium.executablePath());")
          echo "PLAYWRIGHT_CHROMIUM_PATH=$CHROMIUM_PATH" >> "$GITHUB_ENV"

      - name: E2E tests
        run: npx playwright test

      - name: Security audit
        continue-on-error: true
        run: npm audit --audit-level=high
