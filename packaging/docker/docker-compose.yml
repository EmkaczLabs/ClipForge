services:
  clipforge-server:
    build:
      context: ../..
      dockerfile: packaging/docker/Dockerfile
    container_name: clipforge-server
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      CLIPFORGE_BIND_ADDR: "0.0.0.0:3000"
      CLIPFORGE_DATABASE_PATH: "/data/clipforge-server.db"
      CLIPFORGE_STORAGE_BACKEND: "local"
      CLIPFORGE_STORAGE_DIR: "/data/clips"
      CLIPFORGE_WEB_DIR: "/app/web"
      CLIPFORGE_MAX_UPLOAD_BYTES: "524288000"
      # CLIPFORGE_PUBLIC_BASE_URL: "https://clips.example.com"
      # CLIPFORGE_BOOTSTRAP_API_KEY: "replace-with-random-secret"
    volumes:
      - clipforge_data:/data

volumes:
  clipforge_data:
